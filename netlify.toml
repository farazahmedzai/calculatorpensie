[build]
  publish = "dist/public"
  command = "node build-static.js"

[build.environment]
  NODE_VERSION = "20"

# Specific redirects must come BEFORE catch-all redirect
[[redirects]]
  from = "/blog/blog/*"
  to = "/blog/:splat"
  status = 301
  force = true

# Old 2025 blog URLs -> new 2026 slugs (preserve link equity, kill soft-404s)
[[redirects]]
  from = "/blog/ghid-calcul-pensie-stat-2025"
  to = "/blog/ghid-calcul-pensie-stat-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/reforma-sistem-pensii-2025"
  to = "/blog/reforma-sistem-pensii-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/pensie-minima-garantata-2025"
  to = "/blog/pensie-minima-garantata-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ghid-pensie-invaliditate-2025"
  to = "/blog/ghid-pensie-invaliditate-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/indexare-pensii-2025-2026"
  to = "/blog/indexare-pensii-2026-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/cumparare-vechime-munca"
  to = "/blog/stagiul-cotizare-cumparare-ani-munca"
  status = 301
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/calculator"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 5000
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/c7f96a3501a24d5ea3bc55625bf9892c.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"