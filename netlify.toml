[build]
  publish = "dist/public"
  command = "node build-static.js"

[build.environment]
  NODE_VERSION = "20"

# Specific redirects must come BEFORE catch-all redirect
[[redirects]]
  from = "/blog/blog/*"
  to = "/blog/:splat"
  status = 301
  force = true

# Old 2025 blog URLs -> new 2026 slugs (preserve link equity, kill soft-404s)
[[redirects]]
  from = "/blog/ghid-calcul-pensie-stat-2025"
  to = "/blog/ghid-calcul-pensie-stat-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/reforma-sistem-pensii-2025"
  to = "/blog/reforma-sistem-pensii-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/pensie-minima-garantata-2025"
  to = "/blog/pensie-minima-garantata-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ghid-pensie-invaliditate-2025"
  to = "/blog/ghid-pensie-invaliditate-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/indexare-pensii-2025-2026"
  to = "/blog/indexare-pensii-2026-2026"
  status = 301
  force = true

[[redirects]]
  from = "/blog/cumparare-vechime-munca"
  to = "/blog/stagiul-cotizare-cumparare-ani-munca"
  status = 301
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = false

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = false

[[redirects]]
  from = "/calculator"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-puncte-de-stabilitate"
  to = "/calculator-puncte-pensie/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-puncte-stabilitate"
  to = "/calculator-puncte-pensie/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-pensie-invaliditate"
  to = "/blog/ghid-pensie-invaliditate-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-pensie-de-invaliditate"
  to = "/blog/ghid-pensie-invaliditate-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-pensie-urmas"
  to = "/blog/pensia-urmas-drepturi-proceduri/"
  status = 301
  force = true

[[redirects]]
  from = "/calculator-pensie-de-urmas"
  to = "/blog/pensia-urmas-drepturi-proceduri/"
  status = 301
  force = true

# Duplicate legacy routes -> their canonical slug (they are aliases, not pages,
# and were never in the sitemap). Redirecting them is what makes the 404
# fallback below safe: every remaining route has its own prerendered index.html.
[[redirects]]
  from = "/termeni"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/termeni-si-conditii"
  to = "/terms/"
  status = 301
  force = true

[[redirects]]
  from = "/politica-confidentialitate"
  to = "/privacy/"
  status = 301
  force = true

# Unknown paths now return a REAL 404 instead of the homepage with status 200.
# Previously every bad URL served /index.html as 200 and canonicalised to /,
# which is a soft 404: wasted crawl budget and typo'd URLs indexing as home.
# scripts/verify-routes-prerendered.mjs fails the build if a real route would
# lose its page to this rule.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[dev]
  command = "npm run dev"
  port = 5000
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/c7f96a3501a24d5ea3bc55625bf9892c.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/ghid-calcul-pensie-2026.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/tools.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=86400"