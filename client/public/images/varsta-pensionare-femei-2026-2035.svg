<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" role="img" aria-label="Egalizarea varstei de pensionare pentru femei si barbati 2024-2035 conform Anexei 5 din Legea 360/2023">
